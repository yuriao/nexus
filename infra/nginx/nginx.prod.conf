worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    upstream auth_service { server auth-service:8001; keepalive 16; }
    upstream core_api     { server core-api:8000;     keepalive 32; }

    # ── HTTP: redirect to HTTPS + serve ACME challenge ───────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME HTTP-01 challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name 8-218-95-2.sslip.io;

        ssl_certificate     /etc/letsencrypt/live/8-218-95-2.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/8-218-95-2.sslip.io/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Dashboard SPA ────────────────────────────────────────────────
        location /nexus-dashboard/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /nexus-dashboard/index.html;
        }

        # ── Auth Service ─────────────────────────────────────────────────
        location /api/auth/ {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # ── WebSocket (WSS) ──────────────────────────────────────────────
        location /ws/ {
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
        }

        # ── Core API ─────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://core_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ── Legacy 8080 passthrough (keeps old URLs working during transition) -
    server {
        listen 8080;
        server_name _;

        location /nexus-dashboard/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /nexus-dashboard/index.html;
        }
        location /api/auth/ {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }
        location /ws/ {
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }
        location /api/ {
            proxy_pass http://core_api;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }
        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}

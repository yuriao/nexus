name: Fix Auth
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix auth + restart all upstreams
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/nexus

            echo "=== Container status ==="
            docker ps -a --format "table {{.Names}}\t{{.Status}}" | grep nexus

            echo "=== Remove ALL stale Created containers ==="
            docker ps -a --filter "status=created" --format "{{.ID}}" | xargs -r docker rm -f

            echo "=== Ensure auth-service is up ==="
            docker compose -f docker-compose.prod.yml up -d auth-service core-api
            sleep 5

            echo "=== Restart nginx to pick up all fresh IPs ==="
            docker compose -f docker-compose.prod.yml restart nginx
            sleep 3

            echo "=== Test auth endpoint ==="
            curl -s -o /dev/null -w "auth: %{http_code}\n" http://localhost:8080/api/auth/token/
            curl -s -o /dev/null -w "api: %{http_code}\n" http://localhost:8080/api/companies/

            echo "=== All containers ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep nexus

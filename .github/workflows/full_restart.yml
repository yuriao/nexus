name: Full Restart
on:
  workflow_dispatch:
jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Full stack restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/nexus

            echo "=== Stop everything cleanly ==="
            docker compose -f docker-compose.prod.yml down --remove-orphans
            sleep 5

            echo "=== Start everything fresh ==="
            docker compose -f docker-compose.prod.yml up -d
            sleep 15

            echo "=== All containers ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep nexus

            echo "=== Test endpoints ==="
            curl -s -o /dev/null -w "auth login: %{http_code}\n" -X POST http://localhost:8080/api/auth/token/ -H "Content-Type: application/json" -d '{"username":"test","password":"test"}'
            curl -s -o /dev/null -w "companies: %{http_code}\n" http://localhost:8080/api/companies/

            echo "Done"

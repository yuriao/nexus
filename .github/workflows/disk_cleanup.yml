name: Disk Cleanup
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Clean Docker + free disk + rebuild scraper
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "=== DISK BEFORE ==="
            df -h /

            echo "=== Docker cleanup ==="
            docker system prune -af --volumes=false 2>&1 | tail -5

            echo "=== DISK AFTER ==="
            df -h /

            echo "=== Rebuild scraper ==="
            cd /opt/nexus
            docker compose -f docker-compose.prod.yml build --no-cache celery-scraper-worker
            docker compose -f docker-compose.prod.yml up -d --force-recreate celery-scraper-worker
            sleep 10

            echo "=== Scraper status ==="
            docker ps --format "{{.Names}}\t{{.Status}}" | grep scraper
            docker logs $(docker ps --format '{{.Names}}' | grep scraper-worker) --tail 15 2>&1

name: Restart All
on:
  workflow_dispatch:
jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Bring up all services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/nexus

            echo "=== Bring up ALL services ==="
            docker compose -f docker-compose.prod.yml up -d
            sleep 10

            echo "=== All containers ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep nexus

            echo "=== Test endpoints ==="
            curl -s -o /dev/null -w "auth: %{http_code}\n" http://localhost:8080/api/auth/token/
            curl -s -o /dev/null -w "api: %{http_code}\n" http://localhost:8080/api/companies/

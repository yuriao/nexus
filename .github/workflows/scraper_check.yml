name: Scraper Check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/nexus
            git pull origin main
            echo "=== Scraper crash log ==="
            docker logs nexus-celery-scraper-worker-1 --tail 30 2>&1
            echo ""
            echo "=== Restart beat + scraper ==="
            docker compose -f docker-compose.prod.yml up -d --force-recreate \
              celery-beat celery-scraper-worker
            sleep 8
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep nexus
            echo "=== Beat log after restart ==="
            docker logs nexus-celery-beat-1 --tail 15 2>&1

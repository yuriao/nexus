name: Diagnose Scraper 2
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Deep diagnostic
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/nexus

            echo "=== ALL CONTAINERS ==="
            docker ps --format "table {{.Names}}\t{{.Status}}"

            echo ""
            echo "=== ENV FILE (redacted) ==="
            cat /opt/nexus/.env | grep -v "SECRET\|PASSWORD\|KEY\|TOKEN" | head -20

            echo ""
            echo "=== SCRAPER WORKER LOGS ==="
            SCRAPER=$(docker ps --format '{{.Names}}' | grep scraper-worker || echo "")
            if [ -n "$SCRAPER" ]; then
              docker logs $SCRAPER --tail 40 2>&1
            else
              echo "NO SCRAPER WORKER CONTAINER FOUND"
              docker ps -a --format "table {{.Names}}\t{{.Status}}" | grep scraper
            fi

            echo ""
            echo "=== DATAPOINT TABLE ==="
            docker exec nexus-mysql-1 mysql -unexus -pnexus_secret nexus_core \
              -e "SELECT COUNT(*) as total FROM companies_datapoint;" 2>/dev/null

            echo ""
            echo "=== BRAVE API KEY SET? ==="
            docker exec nexus-celery-agent-worker-1 env 2>/dev/null | grep -i "BRAVE\|SEARCH" | sed 's/=.*/=***/' || echo "check failed"

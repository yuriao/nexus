name: Test Auth
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test_auth.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test auth endpoints
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "=== Test login with username field ==="
            curl -sk -w "\nHTTP: %{http_code}\n" \
              -X POST https://localhost/api/auth/login/ \
              -H "Content-Type: application/json" \
              -H "Origin: https://yuriao.github.io" \
              -d '{"username":"admin","password":"wrongpass"}'

            echo ""
            echo "=== Test register ==="
            curl -sk -w "\nHTTP: %{http_code}\n" \
              -X POST https://localhost/api/auth/register/ \
              -H "Content-Type: application/json" \
              -H "Origin: https://yuriao.github.io" \
              -d '{"username":"testuser99","email":"test99@test.com","password":"Test1234!","password2":"Test1234!"}'

            echo ""
            echo "=== CORS headers on POST ==="
            curl -sk -v -X POST https://localhost/api/auth/login/ \
              -H "Content-Type: application/json" \
              -H "Origin: https://yuriao.github.io" \
              -d '{"username":"x","password":"x"}' 2>&1 | grep -iE "access-control|cors|< HTTP|origin"

            echo ""
            echo "=== Auth service alive? ==="
            docker logs nexus-auth-service-1 --tail 5 2>&1

name: Start New Services
on:
  workflow_dispatch:

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Start beat + scraper services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/nexus
            docker compose -f docker-compose.prod.yml up -d \
              celery-beat celery-beat-worker celery-scraper-worker celery-agent-worker
            sleep 8
            echo "=== All containers ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep nexus
            echo ""
            echo "=== Beat log ==="
            docker logs nexus-celery-beat-1 --tail 20 2>&1

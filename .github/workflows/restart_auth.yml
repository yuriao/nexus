name: Restart Auth
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restart_auth.yml']
jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild and restart auth service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/nexus
            git pull origin main

            docker compose -f docker-compose.prod.yml build --no-cache auth-service
            docker compose -f docker-compose.prod.yml up -d --force-recreate auth-service
            sleep 5
            docker compose -f docker-compose.prod.yml restart nginx
            sleep 3

            echo "=== Auth service status ==="
            docker ps --format "{{.Names}}\t{{.Status}}" | grep auth

            echo "=== Test login (username) ==="
            curl -sk -w "\nHTTP: %{http_code}\n" \
              -X POST https://localhost/api/auth/login/ \
              -H "Content-Type: application/json" \
              -H "Origin: https://yuriao.github.io" \
              -d '{"username":"admin","password":"wrongpass"}'

            echo "=== CORS headers ==="
            curl -sk -D - -X POST https://localhost/api/auth/login/ \
              -H "Content-Type: application/json" \
              -H "Origin: https://yuriao.github.io" \
              -d '{"username":"x","password":"x"}' 2>&1 | grep -iE "access-control|HTTP/|< vary"

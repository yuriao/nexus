name: Trigger Scrapes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trigger_scrapes.yml']
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scrapes and check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "=== Beat worker logs ==="
            docker logs nexus-celery-beat-worker-1 --tail 30 2>&1

            echo ""
            echo "=== Beat scheduler logs ==="
            docker logs nexus-celery-beat-1 --tail 20 2>&1

            echo ""
            echo "=== Why scraper-service keeps restarting ==="
            docker logs nexus-scraper-service-1 --tail 20 2>&1

            echo ""
            echo "=== Direct scrape trigger via redis ==="
            docker exec nexus-redis-1 redis-cli -n 1 LLEN scraper

            echo ""
            echo "=== Trigger scrape for each company directly ==="
            for CID in 1 5 6 7 8; do
              docker exec nexus-celery-scraper-worker-1 celery -A celery_app call \
                tasks.run_company_scrape --args "[${CID}]" -Q scraper 2>&1 | head -2
              echo "Triggered company $CID"
            done

            echo ""
            echo "=== Wait 30s then check for activity ==="
            sleep 30
            docker logs nexus-celery-scraper-worker-1 --tail 20 2>&1

name: Deploy Nexus Backend
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with SSL
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/nexus
            # Write secrets to .env for docker compose
            printf 'BRAVE_API_KEY=%s\nMOONSHOT_API_KEY=%s\nOPENAI_API_KEY=%s\nOPENAI_BASE_URL=%s\nDJANGO_SECRET_KEY=%s\nSERVER_HOST=%s\n' \
              '${{ secrets.BRAVE_API_KEY }}' \
              '${{ secrets.MOONSHOT_API_KEY }}' \
              '${{ secrets.OPENAI_API_KEY }}' \
              '${{ secrets.OPENAI_BASE_URL }}' \
              '${{ secrets.DJANGO_SECRET_KEY }}' \
              '${{ secrets.SERVER_HOST }}' > .env
            git stash && git fetch origin main && git reset --hard origin/main

            DOMAIN="8-218-95-2.sslip.io"
            docker volume create nexus_certbot_www 2>/dev/null || true
            docker volume create nexus_certbot_certs 2>/dev/null || true
            CERTBOT_CERTS=$(docker volume inspect nexus_certbot_certs --format '{{.Mountpoint}}')
            CERT_PATH="${CERTBOT_CERTS}/live/${DOMAIN}/fullchain.pem"

            docker compose -f docker-compose.prod.yml build --no-cache \
              celery-scraper-worker celery-agent-worker \
              celery-beat celery-beat-worker core-api auth-service

            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate auth-service core-api
            docker compose -f docker-compose.prod.yml up -d
            sleep 10

            if [ -f "$CERT_PATH" ]; then
              cp infra/nginx/nginx.ssl.conf infra/nginx/nginx.prod.conf
            fi
            docker compose -f docker-compose.prod.yml restart nginx
            sleep 5

            echo "=== Containers ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep nexus

            echo "=== Scraper logs ==="
            docker logs nexus-celery-scraper-worker-1 --tail 20 2>&1

            echo "=== DataPoints ==="
            docker exec nexus-mysql-1 mysql -unexus -pnexus_secret nexus_core -e "SELECT company_id, source_type, COUNT(*) cnt FROM companies_datapoint GROUP BY company_id, source_type;" 2>/dev/null

            echo "=== Companies ==="
            docker exec nexus-mysql-1 mysql -unexus -pnexus_secret nexus_core -e "SELECT id, name, last_crawled_at FROM companies_company;" 2>/dev/null

            echo "=== Trigger scrapes ==="
            docker exec nexus-celery-scraper-worker-1 python3 << 'PYEOF'
            import sys; sys.path.insert(0, '/app')
            from celery_app import app
            import MySQLdb
            db = MySQLdb.connect(host='mysql',user='nexus',passwd='nexus_secret',db='nexus_core')
            cur = db.cursor()
            cur.execute('SELECT id, name FROM companies_company LIMIT 10')
            for cid, name in cur.fetchall():
                r = app.send_task('tasks.run_company_scrape', kwargs={'company_id': cid}, queue='scraper')
                print(f'Dispatched: {name} (id={cid}): {r.id}')
            db.close()
            PYEOF

            curl -sk -o /dev/null -w "https: %{http_code}\n" https://localhost/health
            echo "Deploy complete"

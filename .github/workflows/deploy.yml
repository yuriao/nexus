name: Deploy Nexus Backend
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with SSL
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/nexus
            git stash && git fetch origin main && git reset --hard origin/main

            # Ensure metrics table exists
            docker exec nexus-mysql-1 mysql -unexus -pnexus_secret nexus_core 2>/dev/null << 'SQL'
            CREATE TABLE IF NOT EXISTS companies_companymetric (
              id VARCHAR(32) NOT NULL PRIMARY KEY,
              company_id INT NOT NULL,
              report_id VARCHAR(36) NOT NULL DEFAULT '',
              metric_code VARCHAR(3) NOT NULL,
              metric_name VARCHAR(200) NOT NULL,
              unit VARCHAR(50) NOT NULL,
              value DECIMAL(18,4) NULL,
              confidence VARCHAR(20) NOT NULL DEFAULT 'low',
              source TEXT NOT NULL DEFAULT '',
              note TEXT NOT NULL DEFAULT '',
              calculated_at DATETIME(6) NOT NULL,
              created_at DATETIME(6) NOT NULL,
              INDEX idx_company_metric_calc (company_id, metric_code, calculated_at),
              CONSTRAINT fk_metric_company FOREIGN KEY (company_id)
                REFERENCES companies_company(id) ON DELETE CASCADE
            );
            SQL

            # Step 1: Start nginx on HTTP only first (for ACME challenge)
            # Use a temp config that only serves port 80 before we have the cert
            CERT_PATH="/etc/letsencrypt/live/8-218-95-2.sslip.io/fullchain.pem"

            if [ ! -f "$CERT_PATH" ]; then
              echo "=== No cert found — getting Let's Encrypt cert ==="

              # Start nginx with HTTP-only config for ACME challenge
              docker run -d --name certbot-nginx \
                -p 80:80 \
                -v $(docker volume inspect nexus_certbot_www --format '{{.Mountpoint}}' 2>/dev/null || echo /tmp/certbot_www):/var/www/certbot \
                nginx:alpine sh -c "
                  mkdir -p /var/www/certbot
                  cat > /etc/nginx/conf.d/default.conf << 'EOF'
            server {
              listen 80;
              location /.well-known/acme-challenge/ { root /var/www/certbot; }
              location / { return 200 'ok'; }
            }
            EOF
                  nginx -g 'daemon off;'" 2>&1 || echo "certbot-nginx already running"

              sleep 3

              # Create volumes if they don't exist
              docker volume create nexus_certbot_www 2>/dev/null || true
              docker volume create nexus_certbot_certs 2>/dev/null || true

              # Run certbot
              docker run --rm \
                -v nexus_certbot_www:/var/www/certbot \
                -v nexus_certbot_certs:/etc/letsencrypt \
                certbot/certbot certonly \
                  --webroot \
                  --webroot-path=/var/www/certbot \
                  --email admin@nexus.local \
                  --agree-tos \
                  --no-eff-email \
                  --non-interactive \
                  -d 8-218-95-2.sslip.io 2>&1

              # Stop temp nginx
              docker stop certbot-nginx 2>/dev/null || true
              docker rm certbot-nginx 2>/dev/null || true
            else
              echo "=== Cert already exists, skipping certbot ==="
            fi

            # Step 2: Build and start all services
            docker compose -f docker-compose.prod.yml build --no-cache \
              celery-scraper-worker celery-agent-worker \
              celery-beat celery-beat-worker core-api

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            sleep 10

            # Step 3: Always restart nginx last
            docker compose -f docker-compose.prod.yml restart nginx
            sleep 5

            echo "=== Containers ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep nexus

            echo "=== SSL test ==="
            curl -sk -o /dev/null -w "https 443: %{http_code}\n" https://localhost/health || echo "https not yet ready"
            curl -s -o /dev/null -w "http 8080: %{http_code}\n" http://localhost:8080/health

            echo "Deploy complete"

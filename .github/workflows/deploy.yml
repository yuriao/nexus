name: Deploy Nexus Backend
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with SSL
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/nexus
            git stash && git fetch origin main && git reset --hard origin/main

            DOMAIN="8-218-95-2.sslip.io"
            docker volume create nexus_certbot_www 2>/dev/null || true
            docker volume create nexus_certbot_certs 2>/dev/null || true
            CERTBOT_CERTS=$(docker volume inspect nexus_certbot_certs --format '{{.Mountpoint}}')
            CERT_PATH="${CERTBOT_CERTS}/live/${DOMAIN}/fullchain.pem"

            docker compose -f docker-compose.prod.yml build --no-cache \
              celery-scraper-worker celery-agent-worker \
              celery-beat celery-beat-worker core-api auth-service

            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate auth-service core-api
            docker compose -f docker-compose.prod.yml up -d
            sleep 10

            if [ -f "$CERT_PATH" ]; then
              cp infra/nginx/nginx.ssl.conf infra/nginx/nginx.prod.conf
            fi
            docker compose -f docker-compose.prod.yml restart nginx
            sleep 5

            echo "=== Containers ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep nexus

            echo "=== SCRAPER WORKER LOGS ==="
            docker logs nexus-celery-scraper-worker-1 --tail 30 2>&1

            echo "=== DATAPOINTS IN DB ==="
            docker exec nexus-mysql-1 mysql -unexus -pnexus_secret nexus_core \
              -e "SELECT company_id, source_type, COUNT(*) as cnt FROM companies_datapoint GROUP BY company_id, source_type;" 2>/dev/null

            echo "=== COMPANIES ==="
            docker exec nexus-mysql-1 mysql -unexus -pnexus_secret nexus_core \
              -e "SELECT id, name, domain, last_crawled_at FROM companies_company;" 2>/dev/null

            echo "=== BEAT WORKER LOGS ==="
            docker logs nexus-celery-beat-worker-1 --tail 15 2>&1

            echo "=== MANUALLY TRIGGER SCRAPE ==="
            docker exec nexus-celery-scraper-worker-1 python3 -c "
import sys; sys.path.insert(0, '/app')
from celery_app import app
import MySQLdb, os
db = MySQLdb.connect(host='mysql',user='nexus',passwd='nexus_secret',db='nexus_core')
cur = db.cursor()
cur.execute('SELECT id, name FROM companies_company LIMIT 10')
companies = cur.fetchall()
db.close()
for cid, name in companies:
    r = app.send_task('tasks.run_company_scrape', kwargs={'company_id': cid}, queue='scraper')
    print(f'Dispatched scrape for {name} (id={cid}): {r.id}')
" 2>&1

            echo "=== HTTPS ==="
            curl -sk -o /dev/null -w "https: %{http_code}\n" https://localhost/health
            echo "Deploy complete"

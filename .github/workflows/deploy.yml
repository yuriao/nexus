name: Deploy Nexus Backend
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with SSL
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/nexus
            git stash && git fetch origin main && git reset --hard origin/main

            # Ensure metrics table
            docker exec nexus-mysql-1 mysql -unexus -pnexus_secret nexus_core 2>/dev/null << 'SQL'
            CREATE TABLE IF NOT EXISTS companies_companymetric (
              id VARCHAR(32) NOT NULL PRIMARY KEY,
              company_id INT NOT NULL,
              report_id VARCHAR(36) NOT NULL DEFAULT '',
              metric_code VARCHAR(3) NOT NULL,
              metric_name VARCHAR(200) NOT NULL,
              unit VARCHAR(50) NOT NULL,
              value DECIMAL(18,4) NULL,
              confidence VARCHAR(20) NOT NULL DEFAULT 'low',
              source TEXT NOT NULL DEFAULT '',
              note TEXT NOT NULL DEFAULT '',
              calculated_at DATETIME(6) NOT NULL,
              created_at DATETIME(6) NOT NULL,
              INDEX idx_company_metric_calc (company_id, metric_code, calculated_at),
              CONSTRAINT fk_metric_company FOREIGN KEY (company_id)
                REFERENCES companies_company(id) ON DELETE CASCADE
            );
            SQL

            DOMAIN="8-218-95-2.sslip.io"
            CERT_PATH="/var/lib/docker/volumes/nexus_certbot_certs/_data/live/${DOMAIN}/fullchain.pem"

            # Create volumes
            docker volume create nexus_certbot_www 2>/dev/null || true
            docker volume create nexus_certbot_certs 2>/dev/null || true
            CERTBOT_WWW=$(docker volume inspect nexus_certbot_www --format '{{.Mountpoint}}')
            CERTBOT_CERTS=$(docker volume inspect nexus_certbot_certs --format '{{.Mountpoint}}')

            if [ ! -f "$CERT_PATH" ]; then
              echo "=== Issuing Let's Encrypt cert ==="

              # Ensure port 80 is free
              docker stop certbot-nginx 2>/dev/null; docker rm certbot-nginx 2>/dev/null || true

              # Temp nginx for ACME challenge on port 80
              docker run -d --name certbot-nginx \
                -p 80:80 \
                -v ${CERTBOT_WWW}:/var/www/certbot \
                nginx:alpine sh -c "
                  echo 'server { listen 80; location /.well-known/acme-challenge/ { root /var/www/certbot; } location / { return 200 ok; } }' \
                    > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
              sleep 3

              docker run --rm \
                -v nexus_certbot_www:/var/www/certbot \
                -v nexus_certbot_certs:/etc/letsencrypt \
                certbot/certbot certonly \
                  --webroot \
                  --webroot-path=/var/www/certbot \
                  --email ${{ secrets.CERTBOT_EMAIL }} \
                  --agree-tos \
                  --no-eff-email \
                  --non-interactive \
                  -d ${DOMAIN}

              docker stop certbot-nginx; docker rm certbot-nginx
            else
              echo "=== Cert already exists ==="
            fi

            # Build services
            docker compose -f docker-compose.prod.yml build --no-cache \
              celery-scraper-worker celery-agent-worker \
              celery-beat celery-beat-worker core-api

            # Start all services
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            sleep 10

            # Restart nginx last (picks up fresh IPs + cert)
            docker compose -f docker-compose.prod.yml restart nginx
            sleep 5

            echo "=== Containers ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep nexus

            echo "=== SSL test ==="
            curl -sk -o /dev/null -w "https 443: %{http_code}\n" https://localhost/health
            curl -s -o /dev/null -w "http 8080: %{http_code}\n" http://localhost:8080/health

            echo "Deploy complete"
